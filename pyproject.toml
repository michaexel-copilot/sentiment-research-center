[project]
name = "src-center"
version = "0.1.0"
description = "Sentiment Research Center: pipelined sentiment-driven asset research with BUY/HOLD/SELL one-pagers"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.1",
    "pyarrow>=16",
    "requests>=2.32",
    "feedparser>=6.0",
    "yfinance>=0.2.50",
    "lxml>=5.0",
    "rapidfuzz>=3.9",
    "vaderSentiment>=3.3",
    "jinja2>=3.1",
    "matplotlib>=3.9",
    "markdown>=3.6",
    "playwright>=1.45",
    "streamlit>=1.38",
    "plotly>=5.22",
    "openai>=1.60",
]

[project.scripts]
src = "src_center.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/src_center"]

[tool.hatch.build.targets.wheel.force-include]
"src/src_center/nlp/prompts" = "src_center/nlp/prompts"
"src/src_center/reports/templates" = "src_center/reports/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
